services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik_net
    labels:
      traefik.enable: true
      traefik.http.routers.ytb-dl.entrypoints: websecure
      traefik.http.routers.ytb-dl.rule: Host("ytb-dl.marcoespinosa.com")
      traefik.docker.network: traefik_net
      traefik.http.services.ytb-dl.loadbalancer.server.port: 3000
      traefik.http.routers.ytb-dl.tls: true
      traefik.http.routers.ytb-dl.tls.certresolver: default
      dashboard.stack.name: youtube-web-downloader

  cron:
    build:
      context: .
      dockerfile: docker/Dockerfile.cron
    volumes:
      - downloads:/downloads
    restart: unless-stopped

volumes:
  downloads:

networks:
  traefik_net:
    external: true
